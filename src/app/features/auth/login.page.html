<div class="login-bg"><form class="login-card" [formGroup]="form" (ngSubmit)="submit()"><div class="brand"><span class="brand-mark">A</span><span><b>AutoAndes</b><small>Taller mecánico</small></span></div><h1>Iniciar sesión</h1><p>Ingresa con tu cuenta para continuar.</p>@if(error){<div class="alert">{{error}}</div>}<label class="field"><span>Usuario</span><input formControlName="username" autocomplete="username">@if(form.controls.username.touched&&form.controls.username.invalid){<small class="error">El usuario es obligatorio.</small>}</label><label class="field"><span>Contraseña</span><input type="password" formControlName="password" autocomplete="current-password">@if(form.controls.password.touched&&form.controls.password.invalid){<small class="error">La contraseña es obligatoria.</small>}</label><button class="button button-primary" [disabled]="loading">{{loading?'Ingresando…':'Ingresar'}}</button></form></div>
