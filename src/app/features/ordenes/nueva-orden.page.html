<div class="page-head"><div><span class="eyebrow">TALLER</span><h1>Nueva orden de servicio</h1><p class="muted">Registra vehículo, kilometraje y servicios solicitados.</p></div><a class="button button-quiet" routerLink="/ordenes">← Volver</a></div>
<div class="alert" *ngIf="error">{{error}}</div><div *ngIf="loading" class="panel empty">Cargando datos…</div>
<form *ngIf="!loading" [formGroup]="form" (ngSubmit)="guardar()"><section class="panel"><div class="panel-head"><b>Datos de la orden</b></div><div class="panel-body grid"><label class="field"><span>Cliente</span><select formControlName="clienteId" (change)="clienteCambio()"><option [ngValue]="0">Selecciona cliente</option><option *ngFor="let c of clientes" [ngValue]="c.id">{{c.nombres}} · {{c.documento}}</option></select></label><label class="field"><span>Vehículo</span><select formControlName="vehiculoId"><option [ngValue]="0">Selecciona vehículo</option><option *ngFor="let v of vehiculosFiltrados" [ngValue]="v.id">{{v.placa}} · {{v.marca}} {{v.modelo}}</option></select></label><label class="field"><span>Kilometraje actual</span><input type="number" min="0" formControlName="kilometraje"><small class="muted">No puede ser menor al último registro del vehículo.</small></label></div></section>
<section class="panel" style="margin-top:1rem"><div class="panel-head"><b>Servicios (1–10, sin repetir)</b><button type="button" class="button button-quiet" [disabled]="detalles.length>=10" (click)="agregar()">＋ Agregar servicio</button></div><div class="panel-body" formArrayName="detalles"><div class="grid order-line" *ngFor="let line of detalles.controls;let i=index" [formGroupName]="i"><label class="field"><span>Servicio</span><select formControlName="servicioId"><option [ngValue]="0">Selecciona servicio activo</option><option *ngFor="let s of servicios" [ngValue]="s.id">{{s.codigo}} · {{s.nombre}} · S/ {{s.precio|number:'1.2-2'}}</option></select></label><label class="field"><span>Cantidad (1–5)</span><input type="number" min="1" max="5" formControlName="cantidad"></label><button type="button" class="button button-danger" [disabled]="detalles.length<=1" (click)="quitar(i)">Quitar</button></div></div><div class="panel-head"><b>Total estimado</b><strong>S/ {{totalEstimado|number:'1.2-2'}}</strong></div></section><div class="form-actions"><button class="button button-primary" [disabled]="saving">{{saving?'Registrando…':'Registrar orden'}}</button></div></form>
